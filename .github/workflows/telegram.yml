# Gửi tín hiệu lọc cổ phiếu về Telegram mỗi 30 phút trong phiên giao dịch.
# Giờ Việt Nam (thứ 2 - thứ 6): 9:15, 9:45, 10:15, 10:45, 11:15, 13:15, 13:45, 14:15
# (bỏ giờ nghỉ trưa 11:30-13:00). GitHub có thể chạy trễ vài phút.
# Danh sách bộ lọc cần gửi: file alerts.json ở thư mục gốc.
name: Tín hiệu Telegram

on:
  schedule:
    # giờ UTC = giờ VN - 7
    - cron: "15,45 2,3,6 * * 1-5" # 9:15 9:45 10:15 10:45 13:15 13:45
    - cron: "15 4,7 * * 1-5" # 11:15 14:15
  workflow_dispatch:
    inputs:
      force:
        description: "Gửi thử cả khi không có phiên giao dịch"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lọc và gửi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: https://vn-proxy.phanvubao-bkdn.workers.dev
        run: node scripts/alert.mjs ${{ inputs.force && '--force' || '' }}
