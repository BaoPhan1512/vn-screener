# Gửi tín hiệu lọc cổ phiếu về Telegram mỗi 30 phút trong phiên giao dịch.
# Giờ Việt Nam (thứ 2 - thứ 6): 9:03, 9:33, 10:03 … 11:33, 13:03 … 14:33, 15:03
# (bỏ giờ nghỉ trưa; ngày lễ không có giao dịch thì script tự bỏ qua). GitHub có thể chạy trễ vài phút.
# Danh sách bộ lọc cần gửi: file alerts.json ở thư mục gốc.
name: Tín hiệu Telegram

on:
  schedule:
    # giờ UTC = giờ VN - 7. Lệch 3 phút khỏi giờ tròn vì GitHub hay bỏ qua lịch đúng :00 / :30
    - cron: "3,33 2,3,4,6,7 * * 1-5" # 9:03-11:33 và 13:03-14:33
    - cron: "3 8 * * 1-5" # 15:03
  workflow_dispatch:
    inputs:
      force:
        description: "Gửi thử cả khi không có phiên giao dịch"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Lịch của GitHub chỉ là dự phòng: nếu Cloudflare đã kích hoạt trong 20 phút qua thì bỏ qua để không gửi trùng
      - name: Kiểm tra trùng lịch
        id: dup
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/telegram.yml/runs?event=workflow_dispatch&created=%3E$since" --jq '.total_count' || echo 0)
          n=${n:-0}
          echo "Số lần Cloudflare/chạy tay trong 20 phút: $n"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi

      - name: Lọc và gửi Telegram
        if: steps.dup.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: https://vn-proxy.phanvubao-bkdn.workers.dev
          WORKER_KEY: ${{ secrets.WORKER_KEY }}
        run: node scripts/alert.mjs ${{ inputs.force && '--force' || '' }}
